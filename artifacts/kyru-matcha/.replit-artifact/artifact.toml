kind = "web"
previewPath = "/"
title = "Kyru Matcha"
version = "1.0.0"
id = "artifacts/kyru-matcha"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20737

[services.development]
run = "pnpm --filter @workspace/kyru-matcha run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kyru-matcha", "run", "build" ]
serve = "static"
publicDir = "artifacts/kyru-matcha/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20737"
BASE_PATH = "/"
